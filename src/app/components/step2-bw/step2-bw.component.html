<div class="step2">
  <div class="header">
    <button class="back-btn" (click)="onBack()">← Back</button>
    <h2>Step 2 — Black & White Processing</h2>
    <div class="header-spacer"></div>
  </div>

  <div class="workspace">
    <div class="image-area">
      <div class="canvas-container">
        <canvas
          #canvas
          (mousedown)="onCanvasMouseDown($event)"
          (mousemove)="onCanvasMouseMove($event)"
          (mouseup)="onCanvasMouseUp()"
          (mouseleave)="onCanvasMouseUp()"
          (wheel)="onCanvasWheel($event)"
          (contextmenu)="$event.preventDefault()"
        ></canvas>
      </div>
    </div>

    <div class="controls">
      <div class="panel">
        <div class="panel-title">Options</div>

        <div class="toggle-row">
          <span class="toggle-label">Orientation</span>
          <button
            class="orientation-btn"
            [class.vertical]="orientation === 'vertical'"
            (click)="onOrientationChange()"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              @if (orientation === 'horizontal') {
                <path d="M3 12h18M15 6l6 6-6 6"/>
              } @else {
                <path d="M12 3v18M6 9l6-6 6 6"/>
              }
            </svg>
            {{ orientation === 'horizontal' ? 'Horizontal' : 'Vertical' }}
          </button>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="fillSpace" [(ngModel)]="fillSpace" (ngModelChange)="onFillSpaceChange()" />
          <label for="fillSpace">Fill space</label>
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="invert" [(ngModel)]="invert" (ngModelChange)="onInvertChange()" />
          <label for="invert">Invert</label>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Model Dimensions (mm)</div>
        <div class="input-group">
          <label for="modelWidth">Width</label>
          <input
            id="modelWidth"
            type="number"
            [(ngModel)]="modelWidth"
            min="1"
            max="500"
            step="0.1"
          />
        </div>
        <div class="input-group">
          <label for="modelHeight">Height</label>
          <input
            id="modelHeight"
            type="number"
            [(ngModel)]="modelHeight"
            min="1"
            max="500"
            step="0.1"
          />
        </div>
        <div class="input-group">
          <label for="thickness">Thickness</label>
          <input
            id="thickness"
            type="number"
            [(ngModel)]="modelThickness"
            min="0.1"
            max="50"
            step="0.1"
          />
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Denoise</div>
        <div class="slider-group">
          <div class="slider-header">
            <label for="intensity">Intensity</label>
            <span class="slider-value">{{ intensity }}</span>
          </div>
          <input
            id="intensity"
            type="range"
            [(ngModel)]="intensity"
            min="0"
            max="100"
            (ngModelChange)="onIntensityChange()"
          />
          <div class="slider-range">
            <span>0</span>
            <span>100</span>
          </div>
        </div>
      </div>

      <button
        class="render-btn"
        (click)="onRender()"
        [disabled]="rendering || !state.currentBwImage"
      >
        @if (rendering) {
          <span class="btn-spinner"></span> Rendering...
        } @else {
          Render STL
        }
      </button>
    </div>
  </div>
</div>
